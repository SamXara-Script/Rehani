<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReHani Basket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="../js/javascript.js" defer></script>
</head>
<body class="inner-page">
  <header class="site-header" data-header>
    <nav class="nav-group nav-left" aria-label="Primary">
      <a class="nav-link" href="Rehani/html/index.html">Home</a>
      <a class="nav-link" href="Rehani/html/index.html#about">Chven Shesaxeb</a>
      <a class="nav-link" href="menu.html">Menu</a>
    </nav>

    <a class="brand" href="index.html" aria-label="Rehani home">
      <span class="brand-kicker">Premium Quality</span>
      <span class="brand-name">Rehani</span>
      <span class="brand-year"></span>
    </a>

    <div class="nav-group nav-right">
      <a class="nav-link" href="gallery.html">Suratebi</a>
      <a class="nav-link" href="contacts.html">Contacts</a>
      <button class="icon-button mobile-toggle" type="button" aria-label="Open navigation" data-menu-toggle>
        <i data-lucide="menu"></i>
      </button>
      <a class="icon-button basket-link active-basket" href="basket.html" aria-label="Basket">
        <i data-lucide="shopping-basket"></i>
        <span class="basket-count" data-basket-count>0</span>
      </a>
    </div>
  </header>

  <div class="mobile-panel" data-mobile-panel>
    <a href="/">Home</a>
    <a href="/html/about.html">Chven Shesaxeb</a>
    <a href="/html/menu.html">Menu</a>
    <a href="/html/gallery.html">Suratebi</a>
    <a href="/html/contacts.html">Contacts</a>
    <a href="/html/basket.html">Basket</a>
  </div>

  <main>
    <section class="page-hero basket-page-hero" aria-labelledby="basket-page-title">
      <div class="page-hero-copy">
        <p class="eyebrow">Sheni Shekveta</p>
        <h1 id="basket-page-title">Kalata</h1>
        <p>Sakvebi An Sasmeli Romelic Gsurs Damatebulia Kalatashi</p>
      </div>
    </section>

    <section class="basket-section" aria-label="Saved basket">
      <div class="basket-layout">
        <div class="basket-panel">
          <div class="page-section-head basket-head">
            <p class="eyebrow">Saved Items</p>
            <h2>Sheni Kalata</h2>
          </div>
          <div class="basket-empty" data-basket-empty>
            <i data-lucide="shopping-basket"></i>
            <p>Sheni Kalata Carielia</p>
            <a class="button button-primary" href="menu.html">Open Menu</a>
          </div>
          <div class="basket-list" data-basket-list></div>
        </div>

        <aside class="basket-summary">
          <h2>Order Summary</h2>
          <div class="summary-row">
            <span>Items</span>
            <strong data-basket-items>0</strong>
          </div>
          <div class="summary-row summary-total">
            <span>Total</span>
            <strong data-basket-total>$0.00</strong>
          </div>
          <button class="button button-outline" type="button" data-clear-basket>Clear Basket</button>
          <a class="button button-primary" href="pay.html">Pay</a>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
